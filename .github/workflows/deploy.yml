name: SIRAJ Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ================= CHECKOUT =================
      - name: Checkout
        uses: actions/checkout@v4

      # ================= NODE =================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # ================= BUILD FRONTEND =================
      - name: Install frontend deps
        working-directory: ./frontend-react
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend-react
        run: npm run build

      # ================= CLEAN DIST ON SERVER =================
      - name: Clean old frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /opt/siraj/frontend-react/dist/*

      # ================= UPLOAD NEW DIST =================
      - name: Upload frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "frontend-react/dist"
          target: "/opt/siraj/frontend-react"
          strip_components: 1

      # ================= BACKEND DEPLOY =================
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /opt/siraj
            git reset --hard
            git pull origin main

            cd backend
            npm ci --omit=dev

            pm2 reload siraj-backend --update-env || pm2 start ecosystem.config.cjs

            pm2 save
