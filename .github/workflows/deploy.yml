name: SIRAJ Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "🚀 Deploy start"

            cd /opt/siraj
            git reset --hard
            git pull origin main

            echo "📦 Backend install"
            cd backend
            npm ci --omit=dev

            echo "♻ Reload backend"
            pm2 reload siraj-backend --update-env || pm2 start server.js --name siraj-backend

            echo "⚡ NO frontend build on server (CI handles it)"

            pm2 save

            echo "✅ Deploy done"
