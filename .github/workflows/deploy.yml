name: SIRAJ Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================= BUILD FRONTEND =================
      - name: Install frontend deps
        working-directory: ./frontend-react
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend-react
        run: npm run build

      # ================= COPY DIST =================
      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "frontend-react/dist/*"
          target: "/opt/siraj/frontend-react/dist"

      # ================= BACKEND DEPLOY =================
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /opt/siraj
            git reset --hard
            git pull origin main

            cd backend
            npm ci --omit=dev

            pm2 reload siraj-backend --update-env || pm2 start server.js --name siraj-backend

            pm2 save
