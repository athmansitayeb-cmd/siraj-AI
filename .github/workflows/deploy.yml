name: SIRAJ Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "🚀 Deploy start"

            cd /opt/siraj
            git reset --hard
            git pull origin main

            echo "📦 Backend install"
            cd backend
            npm ci --only=production

            echo "♻ Reload backend (zero downtime)"
            pm2 reload siraj-backend --update-env || pm2 start server.js --name siraj-backend

            echo "⚡ Frontend build"
            cd ../frontend-react
            npm ci
            npm run build

            echo "💾 Save PM2 state"
            pm2 save

            echo "✅ Deploy done"
